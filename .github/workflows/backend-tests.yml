name: Backend tests

on:
  pull_request:
    branches: [main, "feat/finished-product-lifecycle", "feat/paid-order-entitlements", "feat/content-studio-emotion-aware-emojis", "feat/country-intelligence-content-to-revenue"]
  push:
    branches: [main, "fix/healthcheck-supabase-query", "fix/missions-error-column-schema-drift", "feat/country-intelligence-content-to-revenue", "feat/country-revenue-attribution", "feat/country-revenue-attribution-synced"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy credentials keep workflow tests on the configured OAuth path.
      # These values are test-only and are never used by a deployed service.
      PINTEREST_CLIENT_ID: test-client-id
      PINTEREST_CLIENT_SECRET: test-client-secret
      PINTEREST_REDIRECT_URI: https://example.test/connectors/oauth/callback
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run Supabase health-query regression tests
        run: python -m pytest -q tests/test_health_supabase_query.py

      - name: Run health-related regression tests
        run: python -m pytest -q tests/test_sprint2.py

      - name: Run opt-in cross-user RLS smoke test
        run: python -m pytest -q tests/test_live_rls_cross_user.py

      - name: Run fal.ai image provider response validation tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_fal_provider_response_validation.py backend/tests/test_fal_image_generation_provider.py

      - name: Run Graphic Design generation and private asset tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_graphic_design_generation.py backend/tests/test_graphic_design_migration.py backend/tests/test_graphic_visual_inspector.py

      - name: Run Pinterest OAuth security tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_pinterest_oauth_config_security.py

      - name: Run LLM provider and Groq failover tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_llm_provider.py

      - name: Run tests for modules changed in this PR
        run: >-
          python -m pytest -q
          tests/test_connectors_base.py
          tests/test_meta_marketing_connector.py
          tests/test_p1_1_approval_resume.py
          tests/test_p1_7b_employee_slice.py
          tests/test_p1_8_approval_integration.py
          tests/test_p1_8_orchestration.py
      - name: Run Creator Community API tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_creator_community.py

      - name: Run AEA Creator Store and Marketplace API tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_creator_store_marketplace.py

      - name: Run AEA Content Studio tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_content_studio.py
      - name: Run AEA market research connector tests
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_content_intelligence.py
          backend/tests/test_market_research_sources.py
          backend/tests/test_world_bank_research.py
          backend/tests/test_country_intelligence.py

      - name: Run country revenue attribution tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_country_revenue_attribution.py

      - name: Run AEA video generation and durable worker tests
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_video_generation.py
          backend/tests/test_video_assembly_worker.py

      - name: Run Pinterest approval and draft workflow tests
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_affiliate_pinterest_approval_linking.py
