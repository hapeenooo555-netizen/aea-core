name: HAPE BROTHERS marketing safety tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_hape_marketing.py"
      - "tests/test_meta_webhooks.py"
      - "tests/test_meta_marketing_connector.py"
      - ".github/workflows/marketing-safety.yml"
  push:
    branches:
      - main
      - "audit/**"

permissions:
  contents: read

jobs:
  marketing-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run HAPE BROTHERS marketing and Meta safety tests
        run: python -m pytest -q tests/test_hape_marketing.py tests/test_meta_webhooks.py tests/test_meta_marketing_connector.py
